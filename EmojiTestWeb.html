<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EmojiTestWeb — Đo hiệu năng thiết bị bằng Emoji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="EmojiTestWeb.css">
</head>
<body>
<div class="app" id="app">

  <header class="readout">
    <div class="fps-block" id="fpsBlock">
      <span class="fps-dot" id="fpsDot"></span>
      <div class="fps-main">
        <div class="fps-number-row">
          <span class="fps-number" id="fpsNumber">0</span>
          <span class="fps-unit">FPS</span>
        </div>
        <span class="fps-caption" id="fpsCaption">Đang chờ đo…</span>
      </div>
      <svg class="fps-spark" id="fpsSpark" viewBox="0 0 100 28" preserveAspectRatio="none">
        <polyline id="fpsSparkLine" points="0,28 100,28"></polyline>
      </svg>
    </div>

    <div class="stats-grid">
      <div class="stat-tile">
        <span class="stat-label">Hiện tại</span>
        <span class="stat-value" id="statCurrent">0</span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Tối đa</span>
        <span class="stat-value" id="statMax">0</span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Tối thiểu</span>
        <span class="stat-value" id="statMin">0</span>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Trung bình</span>
        <span class="stat-value" id="statAvg">0</span>
      </div>
    </div>
  </header>

  <main class="field" id="field">
    <p class="field-empty" id="fieldEmpty">Chọn số lượng Emoji ở bảng bên dưới để bắt đầu đo</p>
  </main>

  <footer class="deck" id="deck">
    <button class="deck-handle" id="deckHandle" type="button" aria-expanded="true" aria-controls="deckBody">
      <span class="deck-handle-bar"></span>
      <span class="deck-handle-label">Bảng điều khiển</span>
      <svg class="deck-chevron" id="deckChevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="deck-body" id="deckBody">
      <div class="deck-row deck-row--auto">
        <button class="btn btn--auto" type="button" data-mode="auto">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" fill="currentColor"/></svg>
          <span>Auto</span>
          <span class="check-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="btn btn--auto" type="button" data-mode="auto60">
          <svg class="btn-icon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Auto 60s</span>
          <span class="check-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>

      <div class="deck-row deck-row--presets" id="presetRow"></div>
    </div>
  </footer>

</div>

<script src="EmojiTestWeb-benchmark.js"></script>
<script src="EmojiTestWeb-app.js"></script>
</body>
</html>
