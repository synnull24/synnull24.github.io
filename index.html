<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Food Simulator VietNam – Đặt Đồ Ăn Ảo, Chỉ Vui Không Lo Gì Cả</title>
<meta name="description" content="Trang web giả lập đặt đồ ăn Việt Nam — 60 món ăn, hoàn toàn không có giao hàng thật hay trả tiền thật. Chỉ vui, không lo gì cả.">
<meta name="theme-color" content="#C6362A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food Simulator VN">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=Lexend:wght@400;500;600;700&family=Baloo+2:wght@600;700&family=Tinos:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="font-system">

<div class="toast-stack" id="toastStack"></div>

<div class="app">

  <div class="topbar">
    <div class="brand" id="brandHome" style="cursor:pointer;">
      <div class="brand-mark"><svg viewBox="0 0 32 32" fill="none"><path d="M6 13c0-5 4.5-9 10-9s10 4 10 9" stroke="#F5EFDE" stroke-width="2.6" stroke-linecap="round"/><path d="M4 13h24l-1.6 11.5A2.6 2.6 0 0 1 23.8 27H8.2a2.6 2.6 0 0 1-2.6-2.5L4 13z" fill="#F5EFDE"/><path d="M11 17.5v4M16 17.5v4M21 17.5v4" stroke="#C6362A" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="brand-name">Food <b>Simulator</b> VN</div>
    </div>
    <div class="topbar-icons">
      <button class="icon-btn" id="ordersNavBtn" aria-label="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v19l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V2z"/><path d="M8.5 7h7M8.5 11h7M8.5 15h4"/></svg></button>
      <button class="icon-btn" id="gearBtn" aria-label="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.6a1.7 1.7 0 0 0 1-1.55V3.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9.6a1.7 1.7 0 0 0 1.55 1H20.5a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
    </div>
  </div>

  <!-- ================= PAGE: HOME ================= -->
  <div class="page active" id="page-home">
    <div class="hero">
      <span class="hero-eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.5 0 7-2.7 7-6.5 0-3-1.8-4.7-2.7-6.9-.4 1.6-1.4 2.6-2 2.2C15.2 8 15 4 12 2c.6 3.4-1 5-2.6 7C8 10.7 7 12.4 7 15c0 3.5 2.5 7 5 7z"/></svg> <span data-i18n="app_tagline"></span></span>
      <h1 class="hero-title">Food <span class="accent">Simulator</span> VietNam</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="stat-row">
        <div class="stat-flag-pill">
          <span class="flag">🇻🇳</span>
          <span class="stat-text" data-i18n="country_name"></span>
          <span class="stat-text">·</span>
          <span class="stat-count" id="dishCountNum">0</span>
          <span class="stat-text" data-i18n="dish_count_suffix"></span>
        </div>
        <div class="offline-pill" id="offlinePillWrap"></div>
      </div>
    </div>

    <div class="controls-row">
      <button class="control-chip" id="chipLanguage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg> <span id="chipLanguageLabel"></span></button>
      <button class="control-chip" id="chipSort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M6 4l-3 3M6 4l3 3M18 20V4M18 20l3-3M18 20l-3-3"/></svg> <span id="sortChipLabel"></span></button>
    </div>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" data-i18n-ph="search_placeholder" autocomplete="off">
      </div>
      <button class="cart-fab-inline" id="cartHeaderBtn" aria-label="cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.3"/><circle cx="18" cy="21" r="1.3"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>
        <span class="badge-count js-cart-badge">0</span>
      </button>
    </div>

    <div class="cat-rail" id="catRail"></div>

    <div class="filter-rail" id="filterRail"></div>

    <div id="rvSection">
      <div class="section-head">
        <span class="section-title" data-i18n="recently_viewed"></span>
        <button class="link-more" id="rvSeeAllBtn"><span data-i18n="view_more"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="rv-strip no-scrollbar" id="rvStrip"></div>
    </div>

    <div class="section-head">
      <span class="section-title" data-i18n="all_dishes"></span>
    </div>
    <div class="grid" id="homeGrid"></div>

    <div class="install-card" id="installRibbon">
      <button class="install-card-dismiss" id="installDismissBtn" aria-label="dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <div class="install-card-icon"><svg viewBox="0 0 32 32" fill="none"><path d="M6 13c0-5 4.5-9 10-9s10 4 10 9" stroke="#F5EFDE" stroke-width="2.6" stroke-linecap="round"/><path d="M4 13h24l-1.6 11.5A2.6 2.6 0 0 1 23.8 27H8.2a2.6 2.6 0 0 1-2.6-2.5L4 13z" fill="#F5EFDE"/><path d="M11 17.5v4M16 17.5v4M21 17.5v4" stroke="#C6362A" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="install-card-title" data-i18n="install_app"></div>
      <div class="install-card-desc" data-i18n="install_desc"></div>
      <button class="btn btn-primary install-card-btn" id="installBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M4 20h16"/></svg> <span data-i18n="install_btn"></span>
      </button>
    </div>
  </div>

  <!-- ================= PAGE: CATEGORY ================= -->
  <div class="page" id="page-category">
    <div class="pagebar">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title"></span>
    </div>
    <div class="grid" id="categoryGrid"></div>
  </div>

  <!-- ================= PAGE: RECENT ================= -->
  <div class="page" id="page-recent">
    <div class="pagebar">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title" data-i18n="recently_viewed"></span>
    </div>
    <div class="grid" id="recentGrid"></div>
  </div>

  <!-- ================= PAGE: DETAIL ================= -->
  <div class="page" id="page-detail"></div>

  <!-- ================= PAGE: CART ================= -->
  <div class="page" id="page-cart">
    <div class="pagebar">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title"></span>
    </div>
    <div class="container">
      <div id="cartList"></div>
      <div class="empty-state" id="cartEmpty" style="display:none;"></div>
    </div>
    <div class="cart-summary-bar" id="cartSummaryBar"></div>
  </div>

  <!-- ================= PAGE: CHECKOUT ================= -->
  <div class="page" id="page-checkout">
    <div class="pagebar">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title" data-i18n="checkout_title"></span>
    </div>
    <div class="container" id="checkoutBody"></div>
  </div>

  <!-- ================= PAGE: TRACKING ================= -->
  <div class="page" id="page-tracking">
    <div class="pagebar">
      <button class="back-btn" data-back-orders><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title" data-i18n="order_code_label"></span>
    </div>
    <div class="track-wrap" id="trackBody"></div>
  </div>

  <!-- ================= PAGE: ORDERS ================= -->
  <div class="page" id="page-orders">
    <div class="pagebar">
      <button class="back-btn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="pagebar-title" data-i18n="orders"></span>
    </div>
    <div class="tabs-row" id="ordersTabs"></div>
    <div id="ordersList"></div>
  </div>

</div>

<button class="fab" id="randomFab" aria-label="random dish">🎲</button>

<!-- ================= SHEETS ================= -->
<div class="sheet-overlay" id="settingsSheetOverlay"></div>
<div class="sheet" id="settingsSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-title"><span data-i18n="settings_title"></span><button class="sheet-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="settingsSheetBody"></div>
</div>

<div class="sheet-overlay" id="languageSheetOverlay"></div>
<div class="sheet" id="languageSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-title"><span data-i18n="choose_language"></span><button class="sheet-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="languageSheetBody"></div>
</div>

<div class="sheet-overlay" id="sortSheetOverlay"></div>
<div class="sheet" id="sortSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-title"><span data-i18n="sort_label"></span><button class="sheet-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div id="sortSheetBody"></div>
</div>

<!-- ================= MODALS ================= -->
<div class="modal-overlay" id="randomModalOverlay">
  <div class="modal-card">
    <button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div id="randomModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="installHintOverlay">
  <div class="modal-card">
    <button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <div id="installHintBody"></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModalOverlay">
  <div class="modal-card" style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">🍽️</div>
    <p id="confirmModalMsg" style="font-size:.9rem;font-weight:600;margin-bottom:18px;"></p>
    <button class="btn btn-primary" id="confirmOkBtn" data-i18n="ok_exclaim" style="width:auto;padding-inline:32px;margin:0 auto;"></button>
  </div>
</div>


<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
